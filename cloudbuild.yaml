steps:
  - name: mcr.microsoft.com/playwright:v1.62.1-noble
    id: test-extension
    entrypoint: bash
    args:
      - -euc
      - |
        npm ci
        npm test

  - name: ubuntu:24.04
    id: package-extension
    waitFor:
      - test-extension
    entrypoint: bash
    args:
      - -euc
      - |
        apt-get update
        apt-get install --yes --no-install-recommends zip
        zip -r "/workspace/domstack-${TAG_NAME}.zip" \
          manifest.json \
          content.js \
          popup.html \
          popup.js \
          styles.css \
          icons \
          LICENSE \
          README.md

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: upload-chrome-web-store
    waitFor:
      - package-extension
    entrypoint: bash
    args:
      - -euc
      - |
        TOKEN="$$(gcloud auth print-access-token \
          --scopes=https://www.googleapis.com/auth/chromewebstore)"
        UPLOAD_URL="https://chromewebstore.googleapis.com/upload/v2/publishers/${_CWS_PUBLISHER_ID}/items/${_CWS_EXTENSION_ID}:upload"
        curl --fail-with-body --silent --show-error \
          --request POST \
          --header "Authorization: Bearer $${TOKEN}" \
          --upload-file "/workspace/domstack-${TAG_NAME}.zip" \
          "$${UPLOAD_URL}"

artifacts:
  objects:
    location: "gs://${PROJECT_ID}_cloudbuild/domstack/${TAG_NAME}/"
    paths:
      - "domstack-${TAG_NAME}.zip"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _CWS_PUBLISHER_ID: a3b0914e-80f3-49bd-a84b-8cb1819f4e10
  _CWS_EXTENSION_ID: mlplebikjaagepjioojfdmcoiamjffhc

timeout: 1200s
