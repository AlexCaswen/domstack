steps:
  - name: node:24-bookworm@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    id: test-extension
    entrypoint: bash
    env:
      - CI=true
      - PUPPETEER_CACHE_DIR=/workspace/.cache/puppeteer
    args:
      - -euc
      - |
        apt-get update
        npm ci --ignore-scripts
        npx puppeteer browsers install chrome --install-deps
        npm run verify

  - name: ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
    id: package-extension
    waitFor:
      - test-extension
    entrypoint: bash
    args:
      - -euc
      - |
        apt-get update
        apt-get install --yes --no-install-recommends zip
        cd /workspace/.output/chrome-mv3
        zip -r "/workspace/domstack-${TAG_NAME}.zip" .

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:d4d7a9a1e3d824db170e56764d5bfe39d9f23924cd51505e0792d360cbed209c
    id: upload-chrome-web-store
    waitFor:
      - package-extension
    entrypoint: bash
    args:
      - -euc
      - |
        TOKEN="$$(gcloud auth print-access-token \
          --impersonate-service-account="${SERVICE_ACCOUNT_EMAIL}" \
          --scopes=https://www.googleapis.com/auth/chromewebstore)"
        PUBLISHER_ID="${_CWS_PUBLISHER_ID_PREFIX}-${_CWS_PUBLISHER_ID_SUFFIX}"
        UPLOAD_URL="https://chromewebstore.googleapis.com/upload/v2/publishers/$${PUBLISHER_ID}/items/${_CWS_EXTENSION_ID}:upload"
        curl --fail-with-body --silent --show-error \
          --request POST \
          --header "Authorization: Bearer $${TOKEN}" \
          --upload-file "/workspace/domstack-${TAG_NAME}.zip" \
          --output /workspace/cws-upload-response.json \
          "$${UPLOAD_URL}"
        python3 -m json.tool /workspace/cws-upload-response.json

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:d4d7a9a1e3d824db170e56764d5bfe39d9f23924cd51505e0792d360cbed209c
    id: submit-chrome-web-store
    waitFor:
      - upload-chrome-web-store
    entrypoint: bash
    args:
      - -euc
      - |
        TOKEN="$$(gcloud auth print-access-token \
          --impersonate-service-account="${SERVICE_ACCOUNT_EMAIL}" \
          --scopes=https://www.googleapis.com/auth/chromewebstore)"
        PUBLISHER_ID="${_CWS_PUBLISHER_ID_PREFIX}-${_CWS_PUBLISHER_ID_SUFFIX}"
        ITEM_URL="https://chromewebstore.googleapis.com/v2/publishers/$${PUBLISHER_ID}/items/${_CWS_EXTENSION_ID}"
        STATUS_JSON="$$(cat /workspace/cws-upload-response.json)"
        UPLOAD_STATE="$$(printf '%s' "$${STATUS_JSON}" | \
          python3 -c 'import json,sys; print(json.load(sys.stdin).get("uploadState", ""))')"

        for ATTEMPT in $$(seq 1 30); do
          case "$${UPLOAD_STATE}" in
            SUCCEEDED)
              break
              ;;
            FAILED|NOT_FOUND)
              printf 'Chrome Web Store upload failed: %s\n' "$${STATUS_JSON}" >&2
              exit 1
              ;;
            IN_PROGRESS)
              if [ "$${ATTEMPT}" -eq 30 ]; then
                printf 'Timed out waiting for Chrome Web Store upload: %s\n' "$${STATUS_JSON}" >&2
                exit 1
              fi
              STATUS_JSON="$$(curl --fail-with-body --silent --show-error \
                --header "Authorization: Bearer $${TOKEN}" \
                "$${ITEM_URL}:fetchStatus")"
              UPLOAD_STATE="$$(printf '%s' "$${STATUS_JSON}" | \
                python3 -c 'import json,sys; print(json.load(sys.stdin).get("lastAsyncUploadState", ""))')"
              sleep 10
              ;;
            *)
              printf 'Unexpected Chrome Web Store upload state: %s\n' "$${UPLOAD_STATE}" >&2
              exit 1
              ;;
          esac
        done

        curl --fail-with-body --silent --show-error \
          --request POST \
          --header "Authorization: Bearer $${TOKEN}" \
          --header "Content-Type: application/json" \
          --data '{"publishType":"DEFAULT_PUBLISH","blockOnWarnings":true}' \
          "$${ITEM_URL}:publish"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  # The public publisher UUID is split to avoid a false-positive OpenVSX token alert.
  _CWS_PUBLISHER_ID_PREFIX: a3b0914e-80f3-49bd
  _CWS_PUBLISHER_ID_SUFFIX: a84b-8cb1819f4e10
  _CWS_EXTENSION_ID: mlplebikjaagepjioojfdmcoiamjffhc

timeout: 1200s
