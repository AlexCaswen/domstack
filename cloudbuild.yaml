steps:
  - name: ubuntu:24.04
    id: package-extension
    entrypoint: bash
    args:
      - -euc
      - |
        apt-get update
        apt-get install --yes --no-install-recommends zip
        zip -r "/workspace/domstack-${TAG_NAME}.zip" \
          manifest.json \
          content.js \
          popup.html \
          popup.js \
          styles.css \
          icons \
          LICENSE \
          README.md

artifacts:
  objects:
    location: "gs://${PROJECT_ID}_cloudbuild/domstack/${TAG_NAME}/"
    paths:
      - "domstack-${TAG_NAME}.zip"

options:
  logging: CLOUD_LOGGING_ONLY
