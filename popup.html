<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 16px;
        background: #fff;
        color: #1a1a1a;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .header img {
        width: 24px;
        height: 24px;
      }
      .header h1 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }
      .description {
        font-size: 12px;
        color: #666;
        line-height: 1.4;
        margin-bottom: 16px;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .toggle-label {
        font-size: 13px;
        font-weight: 500;
      }
      .toggle {
        position: relative;
        width: 40px;
        height: 22px;
      }
      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #ccc;
        border-radius: 22px;
        transition: background 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      input:checked + .slider {
        background: #e85d3a;
      }
      input:checked + .slider::before {
        transform: translateX(18px);
      }
      .status {
        font-size: 11px;
        color: #999;
        margin-top: 12px;
        text-align: center;
      }
      .status.active {
        color: #e85d3a;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="icons/icon48.png" alt="DOMstack" />
      <h1>DOMstack</h1>
    </div>
    <p class="description">
      Auto-skips pledge prompts, share nags, and other subscribe-flow interruptions on Substack.
    </p>
    <div class="toggle-row">
      <span class="toggle-label">Enabled</span>
      <label class="toggle">
        <input type="checkbox" id="toggle" checked />
        <span class="slider"></span>
      </label>
    </div>
    <p class="status" id="status">Active on *.substack.com</p>

    <script src="popup.js"></script>
  </body>
</html>
